name: Build country-only Antinet config

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/build.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build grouped config
        run: python scripts/build.py
      - name: Validate JSON
        run: python -m json.tool dist/antinet-countries.json > /dev/null
      - name: Commit generated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/antinet-countries.json dist/report.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update country subscription"
            git push
          fi
